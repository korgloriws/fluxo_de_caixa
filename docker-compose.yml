# Deploy na VPS (porta pública direta, sem nginx path).
#   docker compose up -d --build
# Acesso: http://IP:3070/

services:
  fluxo:
    build: .
    image: fluxo-de-caixa
    container_name: fluxo_de_caixa
    ports:
      - "${APP_PORT:-3070}:8000"
    env_file:
      - .env
    environment:
      HOST: "0.0.0.0"
      PORT: "8000"
      DATA_DIR: /app/data
      UPLOADS_DIR: /app/uploads
      EXPORTS_DIR: /app/exports
      ROOT_PATH: ${ROOT_PATH:-}
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./exports:/app/exports
    restart: unless-stopped
