<!DOCTYPE html>
<html lang="pt-BR" data-tema="claro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block titulo %}{{ app_name }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ root_path }}/static/css/app.css?v=26">
  <link rel="icon" type="image/svg+xml" href="{{ root_path }}/static/img/logo.svg">
  <script>
    window.__ROOT_PATH__ = {{ root_path|tojson }};
    window.withRoot = function (path) {
      var root = window.__ROOT_PATH__ || '';
      if (!path || typeof path !== 'string') return path;
      if (/^https?:\/\//i.test(path)) return path;
      if (root && (path === root || path.indexOf(root + '/') === 0)) return path;
      if (path.charAt(0) === '/') return root + path;
      return path;
    };
    // Aplicado antes da primeira pintura para não piscar o tema errado.
    (function () {
      var salvo = localStorage.getItem('fundeb-tema');
      var escuro = salvo ? salvo === 'escuro' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.tema = escuro ? 'escuro' : 'claro';
    })();
  </script>
</head>
<body>
  <div class="carregando" id="barra-carregando"></div>

  {% block conteudo %}{% endblock %}

  <div class="notificacoes" id="notificacoes"></div>

  <script src="{{ root_path }}/static/vendor/echarts.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
