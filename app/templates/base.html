<!DOCTYPE html>
<html lang="pt-BR" data-tema="claro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block titulo %}{{ app_name }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/app.css?v=14">
  <link rel="icon" type="image/svg+xml" href="/static/img/logo.svg">
  <script>
    // Aplicado antes da primeira pintura para não piscar o tema errado.
    (function () {
      var salvo = localStorage.getItem('fundeb-tema');
      var escuro = salvo ? salvo === 'escuro' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.tema = escuro ? 'escuro' : 'claro';
    })();
  </script>
</head>
<body>
  <div class="carregando" id="barra-carregando"></div>

  {% block conteudo %}{% endblock %}

  <div class="notificacoes" id="notificacoes"></div>

  <script src="/static/vendor/echarts.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
